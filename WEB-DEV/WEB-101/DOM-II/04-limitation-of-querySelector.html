<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <!-- there is one limitation of querySelector. It will select only first elements -->

    <p>p1</p>
    <h1>heading1</h1>
    <p>p2</p>
    <p>p3</p>
    <h1>heading2</h1>
    <p>p4</p>
</body>
</html>

<script>
    document.querySelector("p").style.backgroundColor="red";

    document.querySelector("h1").style.color="green";

    // querySelector select only first element instead of selecting all elements
</script>
