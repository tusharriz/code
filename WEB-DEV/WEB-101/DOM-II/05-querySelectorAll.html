 <!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <p>p1</p>
    <p>p2</p>
    <p>p3</p>
    <p>p4</p>
</body>
</html>

<script>
    //for getting all the p tag use querySelectorAll and it give an array
    // console.log(document.querySelectorAll("p"));


    document.querySelectorAll("p")[0].style.background="green";
    document.querySelectorAll("p")[1].style.background="red";
    document.querySelectorAll("p")[2].style.background="yellow";
    document.querySelectorAll("p")[3].style.background="teal";

    // if you want to give same bg color to all p tags and write less code so run a for loop

    let pTags = document.querySelectorAll("p");

    for(let i=0; i<=pTags.length-1; i++){
        pTags[i].style.fontSize="30px";
    }

    
</script>
