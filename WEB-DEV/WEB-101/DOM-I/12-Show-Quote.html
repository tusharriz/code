<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- On clicking on button, display the quote given in p tag in console -->

    <p id="quote">Talk is cheap. Show me the code</p>

    <button onclick="showQuote()">Show Quote in console</button>

</body>
</html>

<script>
    function showQuote(){
        console.log(document.getElementById("quote").innerText);
    }
</script>
