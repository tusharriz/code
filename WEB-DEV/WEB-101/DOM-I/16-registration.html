<!DOCTYPE html>
<html>
<head>
	<title>Registration</title>
</head>
<body>

	<input id="name" type="text" name="name" placeholder="enter your name" >
	
	<select id="gender">
		<option value="">gender</option>
		<option value="Male">Male</option>
		<option value="Female">Female</option>
	</select>

	<input id="email"  type="text" placeholder="enter your email" >
	<input id="mobile" type="text" placeholder="enter your mobile" >

	<hr>
	<h1 id="dName">NAME</h1>
	<h2 id="dGender">GENDER</h2>
	<h3 id="dEmail">EMAIL</h3>
	<h4 id="dMobile">MOBILE</h4>
	<hr>

	<button onclick="showName()">NAME</button>
	<button onclick="showGender()">GENDER</button>
	<button onclick="showEmail()">EMAIL</button>
	<button onclick="showMobile()">MOBILE</button>
	<button onclick="resetForm()">RESET FORM</button>
	<button onclick="resetDisplay()">RESET DISPLAY</button>


</body>
</html>

<script type="text/javascript">
	function showName() {
		// Show filled name inside h1
		let name = document.getElementById("name").value;
		document.getElementById("dName").innerText = "NAME : " + name;
	
	}

	function showGender() {
		// Show the selected gender inside h2
		let userGender = document.getElementById("gender").value;
		document.getElementById("dGender").innerText = "GENDER : " + userGender
	}

	function showEmail() {
		// Show the filled email inside h3
		let userEmail = document.getElementById("email").value;
		document.getElementById("dEmail").innerText = "EMAIL : " + userEmail;
	}

	function showMobile() {
		// Show the filled mobile inside h4
		let userMobile = document.getElementById("mobile").value;
		document.getElementById("dMobile").innerText = "MOBILE : " + userMobile;
	}

	function resetDisplay() {
		// Reset all the form elements to default values (blank "")
		document.getElementById("dName").innerText = "NAME"
		document.getElementById("dGender").innerText = "GENDER"
		document.getElementById("dEmail").innerText = "EMAIL"
		document.getElementById("dMobile").innerText = "MOBILE"
	}

	function resetForm() {
		// Reset all the headings (h1, h2, h3, h4) to blank values
		document.getElementById("name").value = ""
		document.getElementById("gender").value = ""
		document.getElementById("email").value = ""
		document.getElementById("mobile").value = ""
	}
</script>
