<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ring Bell</title>
</head>
<body>
    <!-- Add an event to button such that, whenever user clicks on button, a message saying that
    "Please open the door" should be shown in console -->

    <button onclick="ringBell()"> Ring Bell 🔔</button>
    
</body>
</html>

<script>
    function ringBell(){
        console.log("Please open the door");
    }
</script>
