<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Website</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="parent-div">

        <!-- header -->
        <header>
            <img class="logo" src="/images/logo.jpg"  alt="Website-logo">
        </header>

        <!-- top-poster -->
        <div class="top-poster">
            <img src="/images/top-bg.jpg" alt="">
        </div>

        <div class="first-row">
            <div>
                <img class="row-div-img" src="/images/1.jpg" alt="">
                <p class="row-div-p">Spider-Man</p>
                <button class="row-div-button">Book tickets</button>
            </div>
            <div>
                <img class="row-div-img" src="/images/2.jpg" alt="">
                <p class="row-div-p">Inside Out 2</p>
                <button class="row-div-button">Book tickets</button>
            </div>
            <div>
                <img class="row-div-img" src="/images/3.jpg" alt="">
                <p class="row-div-p">Jetcat</p>
                <button class="row-div-button">Book tickets</button>
            </div>
            <div>
                <img class="row-div-img" src="/images/4.jpg" alt="">
                <p class="row-div-p">Moana</p>
                <button class="row-div-button">Book tickets</button>
            </div>
        </div>

        <div class="second-row">
            <div>
                <img class="row-div-img" src="/images/5.jpg" alt="">
                <p class="row-div-p">Minions</p>
                <button class="row-div-button">Book tickets</button>
            </div>
            <div>
                <img class="row-div-img" src="/images/6.jpg" alt="">
                <p class="row-div-p">Toy Story 5</p>
                <button class="row-div-button">Book tickets</button>
            </div>
            <div>
                <img class="row-div-img" src="/images/7.jpg" alt="">
                <p class="row-div-p">Jagannath</p>
                <button class="row-div-button">Book tickets</button>
            </div>
            <div>
                <img class="row-div-img" src="/images/8.jpg" alt="">
                <p class="row-div-p">Spider-Man</p>
                <button class="row-div-button">Book tickets</button>
            </div>
        </div>











    </div>
</body>
</html>
